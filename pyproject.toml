[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["services", "web"]
omit = [
    "*/__pycache__/*",
    "tests/*",
    "scratch/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "node_modules",
    "data",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults (standard in FastAPI Depends)
    "B904", # raise from
]

[tool.ruff.lint.isort]
known-first-party = ["services", "web"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
exclude = [
    "^data/",
    "^scratch/",
    "^node_modules/",
]
