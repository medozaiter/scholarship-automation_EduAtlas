name: Global Scholarship Intelligence Automation Trigger

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to handle Render free tier sleep
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  stateless-radar-scan:
    name: Execute Global Radar Scan & Automation Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake Render Web Service and Trigger Global Automation Cycle
        env:
          PROD_APP_URL: ${{ secrets.PROD_APP_URL || 'https://eduatlas-irxv.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Initiating global discovery & automation trigger to: $PROD_APP_URL"
          
          # 1. Trigger radar discovery scan (wakes Render container if asleep)
          SCAN_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${PROD_APP_URL}/api/cron/trigger-scan" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --connect-timeout 60 \
            --max-time 300)
            
          HTTP_STATUS=$(echo "$SCAN_RESPONSE" | tail -n1 | cut -d':' -f2)
          echo "Trigger Scan Response Status: $HTTP_STATUS"
          
          # 2. Trigger full automation cycle (matching, digests, deadline reminders)
          CYCLE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${PROD_APP_URL}/api/automation/trigger-cycle" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --connect-timeout 60 \
            --max-time 300)
            
          CYCLE_STATUS=$(echo "$CYCLE_RESPONSE" | tail -n1 | cut -d':' -f2)
          echo "Automation Cycle Response Status: $CYCLE_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 202 ] || [ "$CYCLE_STATUS" -eq 200 ] || [ "$CYCLE_STATUS" -eq 202 ]; then
            echo "✅ Stateless automation cycle executed successfully."
          else
            echo "⚠️ Warning: Server responded with status Scan=$HTTP_STATUS, Cycle=$CYCLE_STATUS"
          fi
