name: CI Pipeline & Quality Gate

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # =========================================================================
  # STAGE 1: LINTING & STYLE
  # Fast static lint checks and formatting verification using Ruff
  # =========================================================================
  lint:
    name: Lint & Code Style (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4

      - name: Run Ruff Linter
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github

      - name: Run Ruff Format Check
        run: |
          echo "Checking code formatting..."
          ruff format --check .

  # =========================================================================
  # STAGE 2: STATIC TYPE CHECKING
  # Validates type annotations, call signatures, and interface contracts
  # =========================================================================
  typecheck:
    name: Static Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.13.0

      - name: Run Mypy Type Check
        run: |
          echo "Executing Mypy static analysis on services and web modules..."
          mypy services web --config-file pyproject.toml

  # =========================================================================
  # STAGE 3: SECURITY & DEPENDENCY AUDIT
  # Detects known vulnerabilities (CVEs) in third-party supply chain packages
  # =========================================================================
  security-audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3

      - name: Scan Python Dependencies for Known Vulnerabilities
        run: |
          echo "Auditing production dependencies against PyPA / OSV vulnerability databases..."
          pip-audit -r requirements.txt --desc

      - name: Set up Node.js for Frontend Dev-Dependency Audit
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Scan Node.js Dependencies
        if: hashFiles('package-lock.json') != ''
        run: |
          echo "Auditing Node devDependencies..."
          npm audit --audit-level=high

  # =========================================================================
  # STAGE 4: AUTOMATED TEST SUITE & COVERAGE
  # Executes unit, integration, and security regression tests with pytest
  # =========================================================================
  test:
    name: Python Test Suite & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: "."
      SECRET_KEY: "ci-pipeline-ephemeral-secret-key-32b"
      ALLOWED_ORIGINS: "*"
      DATABASE_URL: "sqlite:///ci_test_database.db"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          echo "Executing test suite with pytest..."
          pytest tests/ -v \
            --cov=services \
            --cov=web \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          retention-days: 14

  # =========================================================================
  # STAGE 5: GATED PRODUCTION DEPLOYMENT
  # Strictly blocked on failure of ANY upstream stage (lint, typecheck, audit, test)
  # Only executes on verified commits on main/master branch
  # =========================================================================
  deploy:
    name: Production Deployment Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, security-audit, test]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    environment:
      name: production
      url: ${{ secrets.PROD_APP_URL || 'https://eduatlas-irxv.onrender.com' }}

    steps:
      - name: Confirm Quality Gate Success
        run: |
          echo "========================================================="
          echo " ALL QUALITY GATES PASSED SUCCESSFULLY:"
          echo " [x] Ruff Lint & Formatting Check"
          echo " [x] Mypy Static Type Analysis"
          echo " [x] pip-audit Dependency Vulnerability Scan"
          echo " [x] Pytest Automated Test Suite & Coverage"
          echo "========================================================="
          echo "Authorized to proceed with production deployment for commit: ${{ github.sha }}"

      - name: Trigger Production Deployment (Render Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured. Deployment trigger skipped."
            echo "To enable automated production deployments, configure RENDER_DEPLOY_HOOK_URL in repository secrets."
            exit 0
          fi

          echo "Triggering Render deployment via secured deploy webhook..."
          DEPLOY_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$DEPLOY_RESPONSE" | tail -n1 | cut -d':' -f2)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deployment webhook triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "::error ::Deployment webhook failed with HTTP status $HTTP_STATUS: $DEPLOY_RESPONSE"
            exit 1
          fi

      - name: Verify Production Healthz Probe
        env:
          APP_URL: ${{ secrets.PROD_APP_URL || 'https://eduatlas-irxv.onrender.com' }}
        run: |
          echo "Waiting for production service to report healthy at ${APP_URL}/healthz..."
          # Allow up to 120 seconds with retries (interval 10s) for deployment propagation
          MAX_ATTEMPTS=12
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health probe attempt $ATTEMPT of $MAX_ATTEMPTS..."
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 10 "${APP_URL}/healthz" || echo "000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Production /healthz probe healthy (HTTP 200): $BODY"
              SUCCESS=1
              break
            fi

            echo "Probe returned status $HTTP_CODE, waiting 10s before retry..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::warning ::Production service did not respond with 200 OK within timeout window (Current status: $HTTP_CODE)."
          else
            echo "Production health check verified."
          fi

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### Production Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** [Production](${{ secrets.PROD_APP_URL || 'https://eduatlas-irxv.onrender.com' }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate Status:** :white_check_mark: All CI checks (Lint, Typecheck, Security Audit, Tests) passed." >> $GITHUB_STEP_SUMMARY
