<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <!-- Background Base -->
  <rect width="1200" height="320" fill="#16324F"/>

  <!-- Right-aligned Squircle App Icon matching classic compass -->
  <g transform="translate(930, 40)">
    <rect width="240" height="240" rx="64" fill="#0E2135"/>
    <rect width="232" height="232" x="4" y="4" rx="60" fill="none" stroke="#B99050" stroke-opacity="0.5" stroke-width="4.5"/>
    <circle cx="120" cy="120" r="102" stroke="#F4F1EA" stroke-width="2" stroke-opacity="0.25" fill="none"/>
    <circle cx="120" cy="120" r="91" stroke="#B99050" stroke-width="4" stroke-dasharray="9 7" stroke-opacity="0.8" fill="none"/>

    <polygon points="120,40 146,120 120,105 94,120" fill="#C86446"/>
    <polygon points="120,200 146,120 120,135 94,120" fill="#F4F1EA"/>
    <circle cx="120" cy="120" r="14" fill="#B99050"/>
  </g>

  <!-- Left Side: Brand Wordmark -->
  <g transform="translate(890, 140)">
    <text x="-160" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#F4F1EA" letter-spacing="-1.5">Edu<tspan fill="#C86446">Atlas</tspan></text>
    <rect x="-135" y="-84" width="135" height="96" rx="28" fill="#B99050" fill-opacity="0.15" stroke="#B99050" stroke-width="4" stroke-opacity="0.5"/>
    <text x="-67" y="-14" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="56" font-weight="800" fill="#B99050">AI</text>
  </g>

  <!-- Line 2: Arabic subtitle -->
  <text x="890" y="240" text-anchor="end" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="54" font-weight="700" fill="#B99050" letter-spacing="0">رادار الملاحة الأكاديمية والمنح الدولية</text>
</svg>
