<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A17"/>
      <stop offset="100%" stop-color="#161224"/>
    </linearGradient>
    <radialGradient id="sqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10E599" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10E599" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0C0A17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="#0C0A17"/>

  <!-- Centered App Icon (460x460 at x=310, y=140) -->
  <g transform="translate(310, 140)">
    <rect width="460" height="460" rx="120" fill="url(#sqBg)"/>
    <circle cx="230" cy="230" r="220" fill="url(#sqGlow)"/>
    <rect width="450" height="450" x="5" y="5" rx="115" fill="none" stroke="#10E599" stroke-opacity="0.4" stroke-width="8"/>

    <!-- Radar Range Rings -->
    <circle cx="230" cy="230" r="195" stroke="#10E599" stroke-width="4.5" stroke-opacity="0.25" fill="none"/>
    <circle cx="230" cy="230" r="175" stroke="#10E599" stroke-width="8" stroke-dasharray="18 14" stroke-opacity="0.6" fill="none"/>

    <!-- Cardinal Ticks -->
    <line x1="230" y1="32" x2="230" y2="60" stroke="#10E599" stroke-width="12" stroke-linecap="round"/>
    <line x1="230" y1="400" x2="230" y2="428" stroke="#10E599" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="32" y1="230" x2="60" y2="230" stroke="#10E599" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="400" y1="230" x2="428" y2="230" stroke="#10E599" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Latitude Ellipse -->
    <ellipse cx="230" cy="230" rx="110" ry="155" stroke="#10E599" stroke-width="4.5" stroke-opacity="0.25" fill="none"/>
    <line x1="60" y1="230" x2="400" y2="230" stroke="#10E599" stroke-width="4" stroke-opacity="0.2"/>

    <!-- Horizontal Stabilizer Wings -->
    <polygon points="230,230 304,230 230,216" fill="#10E599" fill-opacity="0.7"/>
    <polygon points="230,230 304,230 230,244" fill="#059669" fill-opacity="0.7"/>
    <polygon points="230,230 156,230 230,216" fill="#E2E8F0" fill-opacity="0.6"/>
    <polygon points="230,230 156,230 230,244" fill="#94A3B8" fill-opacity="0.6"/>

    <!-- Needles -->
    <polygon points="230,395 230,230 191,230" fill="#FFFFFF"/>
    <polygon points="230,395 269,230 230,230" fill="#94A3B8"/>
    <polygon points="230,65 230,230 191,230" fill="#34D399"/>
    <polygon points="230,65 269,230 230,230" fill="#059669"/>

    <!-- Center Hub -->
    <circle cx="230" cy="230" r="33" fill="#0C0A17" stroke="#10E599" stroke-width="9"/>
    <circle cx="230" cy="230" r="16" fill="#10E599"/>
  </g>

  <!-- Typography Lockup -->
  <!-- "EduAtlas" + Badge "AI" -->
  <g transform="translate(540, 720)">
    <text x="-60" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Edu<tspan fill="#10E599">Atlas</tspan></text>
    
    <!-- AI Pill Badge -->
    <rect x="-35" y="-76" width="125" height="92" rx="26" fill="#10E599" fill-opacity="0.12" stroke="#10E599" stroke-width="4" stroke-opacity="0.4"/>
    <text x="27" y="-12" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="52" font-weight="800" fill="#10E599" letter-spacing="1">AI</text>
  </g>

  <!-- Subtitle: "رادار الملاحة الأكاديمية والمنح الدولية" -->
  <text x="540" y="830" text-anchor="middle" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="44" font-weight="700" fill="#A5B4FC" letter-spacing="0">رادار الملاحة الأكاديمية والمنح الدولية</text>

  <!-- Slogan / Tagline (small footer) -->
  <text x="540" y="900" text-anchor="middle" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="500" fill="#64748B" letter-spacing="0">بوصلتك الذكية نحو جامعات العالم</text>

</svg>
