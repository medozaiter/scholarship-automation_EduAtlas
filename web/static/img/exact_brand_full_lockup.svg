<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background Base -->
  <rect width="1080" height="1080" fill="#16324F"/>

  <!-- Centered App Icon (460x460 at x=310, y=140) -->
  <g transform="translate(310, 140)">
    <rect width="460" height="460" rx="120" fill="#0E2135"/>
    <rect width="450" height="450" x="5" y="5" rx="115" fill="none" stroke="#B99050" stroke-opacity="0.5" stroke-width="8"/>

    <!-- Radar Range Rings -->
    <circle cx="230" cy="230" r="195" stroke="#F4F1EA" stroke-width="4.5" stroke-opacity="0.25" fill="none"/>
    <circle cx="230" cy="230" r="175" stroke="#B99050" stroke-width="8" stroke-dasharray="18 14" stroke-opacity="0.8" fill="none"/>

    <!-- Needles -->
    <polygon points="230,395 230,230 191,230" fill="#F4F1EA"/>
    <polygon points="230,395 269,230 230,230" fill="#E2E8F0"/>
    <polygon points="230,65 230,230 191,230" fill="#C86446"/>
    <polygon points="230,65 269,230 230,230" fill="#A84B32"/>

    <!-- Center Hub -->
    <circle cx="230" cy="230" r="33" fill="#B99050"/>
    <circle cx="230" cy="230" r="16" fill="#16324F"/>
    <circle cx="230" cy="230" r="7" fill="#B99050"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(540, 750)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="100" font-weight="900" fill="#F4F1EA" letter-spacing="-2">Edu<tspan fill="#C86446">Atlas</tspan></text>
    <text x="0" y="80" text-anchor="middle" font-family="'Cairo', 'IBM Plex Sans Arabic', sans-serif" font-size="38" font-weight="700" fill="#B99050">رادار الملاحة الأكاديمية والمنح الدولية</text>
  </g>
</svg>
