<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A17"/>
      <stop offset="100%" stop-color="#161224"/>
    </linearGradient>
    <radialGradient id="sqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10E599" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10E599" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0C0A17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base (Dark Obsidian) -->
  <rect width="1080" height="1080" fill="#0C0A17"/>

  <!-- Centered Squircle App Icon matching exact screenshot (800x800 with rx=208) -->
  <g transform="translate(140, 140)">
    <rect width="800" height="800" rx="208" fill="url(#sqBg)"/>
    <circle cx="400" cy="400" r="380" fill="url(#sqGlow)"/>
    <rect width="784" height="784" x="8" y="8" rx="200" fill="none" stroke="#10E599" stroke-opacity="0.4" stroke-width="14"/>

    <!-- Radar Range Rings (from exact favicon.svg and index.html) -->
    <circle cx="400" cy="400" r="340" stroke="#10E599" stroke-width="8" stroke-opacity="0.25" fill="none"/>
    <circle cx="400" cy="400" r="304" stroke="#10E599" stroke-width="14" stroke-dasharray="32 24" stroke-opacity="0.6" fill="none"/>

    <!-- Cardinal Ticks -->
    <line x1="400" y1="56" x2="400" y2="104" stroke="#10E599" stroke-width="20" stroke-linecap="round"/>
    <line x1="400" y1="696" x2="400" y2="744" stroke="#10E599" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="56" y1="400" x2="104" y2="400" stroke="#10E599" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="696" y1="400" x2="744" y2="400" stroke="#10E599" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Diagonal Ticks -->
    <line x1="176" y1="176" x2="208" y2="208" stroke="#10E599" stroke-width="12" stroke-opacity="0.5"/>
    <line x1="624" y1="176" x2="592" y2="208" stroke="#10E599" stroke-width="12" stroke-opacity="0.5"/>
    <line x1="176" y1="624" x2="208" y2="592" stroke="#10E599" stroke-width="12" stroke-opacity="0.5"/>
    <line x1="624" y1="624" x2="592" y2="592" stroke="#10E599" stroke-width="12" stroke-opacity="0.5"/>

    <!-- Modern Cartographer Elliptical Grids -->
    <ellipse cx="400" cy="400" rx="192" ry="272" stroke="#10E599" stroke-width="8" stroke-opacity="0.25" fill="none"/>
    <line x1="104" y1="400" x2="696" y2="400" stroke="#10E599" stroke-width="7" stroke-opacity="0.2"/>

    <!-- Horizontal Stabilizer Wings -->
    <polygon points="400,400 528,400 400,376" fill="#10E599" fill-opacity="0.7"/>
    <polygon points="400,400 528,400 400,424" fill="#059669" fill-opacity="0.7"/>
    <polygon points="400,400 272,400 400,376" fill="#E2E8F0" fill-opacity="0.6"/>
    <polygon points="400,400 272,400 400,424" fill="#94A3B8" fill-opacity="0.6"/>

    <!-- South Needle (Facing Down - Platinum / Slate) -->
    <polygon points="400,688 400,400 332,400" fill="#FFFFFF"/>
    <polygon points="400,688 468,400 400,400" fill="#94A3B8"/>

    <!-- North Needle (Facing Up - Laser Mint) -->
    <polygon points="400,112 400,400 332,400" fill="#34D399"/>
    <polygon points="400,112 468,400 400,400" fill="#059669"/>

    <!-- Center Hub -->
    <circle cx="400" cy="400" r="58" fill="#0C0A17" stroke="#10E599" stroke-width="16"/>
    <circle cx="400" cy="400" r="28" fill="#10E599"/>
  </g>
</svg>
