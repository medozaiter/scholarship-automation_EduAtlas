<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3E60"/>
      <stop offset="70%" stop-color="#16324F"/>
      <stop offset="100%" stop-color="#0E2135"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Compass Outer Golden Ring -->
  <circle cx="540" cy="540" r="420" stroke="#B99050" stroke-width="16" stroke-opacity="0.8" fill="none"/>
  <circle cx="540" cy="540" r="390" stroke="#F4F1EA" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.3" fill="none"/>

  <!-- Needles -->
  <polygon points="540,160 635,540 540,490 445,540" fill="#C86446"/>
  <polygon points="540,920 635,540 540,590 445,540" fill="#F4F1EA"/>

  <!-- Center Hub -->
  <circle cx="540" cy="540" r="60" fill="#B99050"/>
  <circle cx="540" cy="540" r="32" fill="#16324F"/>
  <circle cx="540" cy="540" r="14" fill="#B99050"/>
</svg>
