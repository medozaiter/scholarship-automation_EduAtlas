<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16324F"/>
      <stop offset="100%" stop-color="#0E2135"/>
    </linearGradient>
    <radialGradient id="sqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B99050" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#B99050" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#16324F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="#16324F"/>

  <!-- Centered Squircle App Icon matching classic cartographic compass (800x800 with rx=208) -->
  <g transform="translate(140, 140)">
    <rect width="800" height="800" rx="208" fill="url(#sqBg)"/>
    <circle cx="400" cy="400" r="380" fill="url(#sqGlow)"/>
    <rect width="784" height="784" x="8" y="8" rx="200" fill="none" stroke="#B99050" stroke-opacity="0.5" stroke-width="14"/>

    <!-- Compass Range Rings -->
    <circle cx="400" cy="400" r="340" stroke="#F4F1EA" stroke-width="6" stroke-opacity="0.25" fill="none"/>
    <circle cx="400" cy="400" r="304" stroke="#B99050" stroke-width="16" stroke-dasharray="32 24" stroke-opacity="0.8" fill="none"/>

    <!-- Cardinal Ticks -->
    <line x1="400" y1="56" x2="400" y2="104" stroke="#B99050" stroke-width="20" stroke-linecap="round"/>
    <line x1="400" y1="696" x2="400" y2="744" stroke="#B99050" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="56" y1="400" x2="104" y2="400" stroke="#B99050" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="696" y1="400" x2="744" y2="400" stroke="#B99050" stroke-width="16" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- North Needle (Terracotta #C86446) -->
    <polygon points="400,128 488,400 400,352 312,400" fill="#C86446"/>

    <!-- South Needle (Cream #F4F1EA) -->
    <polygon points="400,672 488,400 400,448 312,400" fill="#F4F1EA"/>

    <!-- Center Gold Pivot (#B99050) -->
    <circle cx="400" cy="400" r="48" fill="#B99050"/>
    <circle cx="400" cy="400" r="24" fill="#16324F"/>
    <circle cx="400" cy="400" r="10" fill="#B99050"/>
  </g>
</svg>
